<div class="page-container">
  <app-page-header title="Enriquecimento de Dados" subtitle="Gerencie o processamento e reprocessamento de dados"/>

  <div class="actions-grid">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Processar Novos</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>Inicia o processamento de processos que ainda não foram enriquecidos.</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-flat-button color="primary" [disabled]="loading()" (click)="executarProcessamento()">
          @if (loading()) {
            <mat-spinner diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
            Processando...
          } @else {
            Executar Processamento
          }
        </button>
      </mat-card-actions>
    </mat-card>

    <mat-card>
      <mat-card-header>
        <mat-card-title>Reprocessar Falhas</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>Inicia o reprocessamento de processos que falharam no enriquecimento.</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-flat-button color="warn" [disabled]="loading()" (click)="executarReprocessamento()">
          @if (loading()) {
            <mat-spinner diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
            Reprocessando...
          } @else {
            Executar Reprocessamento
          }
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
