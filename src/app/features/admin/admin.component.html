<div class="admin-container">
  <h1>Painel Administrativo</h1>
  <p>Gerenciamento de configurações e tarefas do sistema.</p>

  <div class="admin-grid">
    <!-- Ingestão -->
    <mat-card class="admin-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>sync</mat-icon>
        <mat-card-title>Ingestão de Dados</mat-card-title>
      </mat-card-header>
      <mat-card-actions>
        <button mat-button color="primary" routerLink="/ingestao">Acessar Ingestão</button>
      </mat-card-actions>
    </mat-card>

    <!-- Enriquecimento -->
    <mat-card class="admin-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>auto_fix_high</mat-icon>
        <mat-card-title>Enriquecimento</mat-card-title>
      </mat-card-header>
      <mat-card-actions>
        <button mat-button color="primary" routerLink="/enriquecimento">Acessar Enriquecimento</button>
      </mat-card-actions>
    </mat-card>

    <!-- Distribuição -->
    <mat-card class="admin-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>share</mat-icon>
        <mat-card-title>Distribuição</mat-card-title>
      </mat-card-header>
      <mat-card-actions>
        <button mat-button color="primary" routerLink="/distribuicao">Acessar Distribuição</button>
      </mat-card-actions>
    </mat-card>

    <!-- Usuários -->
    <mat-card class="admin-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>manage_accounts</mat-icon>
        <mat-card-title>Gestão de Usuários</mat-card-title>
      </mat-card-header>
      <mat-card-actions>
        <button mat-button color="primary" routerLink="/usuarios">Acessar Usuários</button>
      </mat-card-actions>
    </mat-card>

    <!-- Equipes -->
    <mat-card class="admin-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>group</mat-icon>
        <mat-card-title>Gestão de Equipes</mat-card-title>
      </mat-card-header>
      <mat-card-actions>
        <button mat-button color="primary" routerLink="/equipes">Acessar Equipes</button>
      </mat-card-actions>
    </mat-card>

    <!-- Vincular Usuários -->
    <mat-card class="admin-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>person_add</mat-icon>
        <mat-card-title>Vincular Usuários</mat-card-title>
      </mat-card-header>
      <mat-card-actions>
        <button mat-button color="primary" routerLink="/usuarios/equipe">Acessar Vinculação</button>
      </mat-card-actions>
    </mat-card>

    <!-- Monitoramento -->
    <mat-card class="admin-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>monitor_heart</mat-icon>
        <mat-card-title>Monitoramento</mat-card-title>
      </mat-card-header>
      <mat-card-actions>
        <button mat-button color="primary" routerLink="/admin/monitoramento">Acessar Monitoramento</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
