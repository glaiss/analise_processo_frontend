name: Frontend CI (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '22'
      run-lint:
        type: boolean
        required: false
        default: true
      run-test:
        type: boolean
        required: false
        default: true
      run-build:
        type: boolean
        required: false
        default: true
      upload-build:
        type: boolean
        required: false
        default: false
    secrets:
      API_URL:
        required: false

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Code
        run: npm run lint

  test:
    if: ${{ inputs.run-test }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm test -- --watch=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: coverage/
          if-no-files-found: ignore

  build:
    if: ${{ inputs.run-build }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Upload build artifact
        if: ${{ inputs.upload-build }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/analise_processo_frontend/browser
          if-no-files-found: error
