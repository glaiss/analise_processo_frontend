name: Frontend Develop CI/CD
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.CLOUDFRONT_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Debug API_URL
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL secret is empty or not found!"
          else
            echo "API_URL is set (value is masked)"
          fi

      - name: Build Project
        run: npm run build

      - name: Verify Generated Environment
        run: |
          echo "Checking generated environment.prod.ts:"
          cat src/environments/environment.prod.ts

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --dir=dist/analise_processo_frontend/browser --prod --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ secrets.NETLIFY_SITE_ID }}

