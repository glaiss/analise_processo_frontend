name: Frontend Develop CI/CD

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a definir (default: próxima)'
        required: false

concurrency:
  group: frontend-develop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.CLOUDFRONT_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Code
        run: npm run lint

      - name: Run Tests
        run: npm test -- --watch=false

      - name: Build Project
        run: npm run build

  bump-version:
    needs: build-and-test
    uses: ./.github/workflows/bump-version.yml
    permissions:
      contents: write
    with:
      bump: true
      version: ${{ inputs.version || '' }}
      deploy_only: false