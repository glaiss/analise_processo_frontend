<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Análise de Processos</mat-card-title>
      <mat-card-subtitle>Acesse sua conta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuário</mat-label>
          <input matInput name="username" [(ngModel)]="credentials.username" required>
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="credentials.password" required>
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        @if (error) {
          <p class="error-text">{{ error }}</p>
        }

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="!loginForm.form.valid || auth.isLoading()">
          @if (auth.isLoading()) {
            <mat-spinner diameter="24"></mat-spinner>
          } @else {
            Entrar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
