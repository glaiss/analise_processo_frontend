<div class="ingestion-container">
  <app-page-header title="Ingestão de Processos" subtitle="Configurar sincronização de novos processos"/>

  <mat-card>
    <mat-card-content>
      <form #ingestForm="ngForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tribunal</mat-label>
          <mat-select name="tribunal" required [(ngModel)]="formData.tribunal">
            @for (t of tribunais; track t) {
              <mat-option [value]="t">{{ t }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Total de Processos</mat-label>
          <input matInput type="number" name="total" required [(ngModel)]="formData.total">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tamanho do Lote (Size)</mat-label>
          <input matInput type="number" name="size" required [(ngModel)]="formData.size">
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="!ingestForm.form.valid || loading()">
          @if (loading()) {
            <mat-spinner diameter="24" />
          } @else {
            Iniciar Sincronização
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
