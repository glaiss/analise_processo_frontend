name: Frontend Develop CI/CD
on:
  push:
    branches:
      - develop
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-frontend]

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.CLOUDFRONT_URL }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Debug Environment
        run: |
          if [ -z "$API_URL" ]; then echo "ERROR: API_URL is empty"; else echo "API_URL is set"; fi
          if [ -z "${{ env.NETLIFY_SITE_ID }}" ]; then echo "ERROR: NETLIFY_SITE_ID is empty"; else echo "NETLIFY_SITE_ID is set"; fi

      - name: Bump version and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump $OLD_VERSION → $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}" --tags

      - name: Build Project
        run: npm run build

      - name: Verify Generated Environment
        run: |
          echo "Checking generated environment.prod.ts:"
          cat src/environments/environment.prod.ts

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --dir=dist/analise_processo_frontend/browser --prod --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ env.NETLIFY_SITE_ID }}

