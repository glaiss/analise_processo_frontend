name: Deploy Frontend (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      deploy_only:
        type: boolean
        required: false
        default: false
      version:
        type: string
        required: false
        default: ''
      netlify-site-id:
        type: string
        required: false
        default: ''
    secrets:
      GH_PAT:
        required: true
      CLOUDFRONT_URL:
        required: true
      NETLIFY_AUTH_TOKEN:
        required: true

concurrency:
  group: frontend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute e persiste versão (idempotente)
        id: bump
        env:
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current=$(node -p "require('./package.json').version")
          new="$current"

          if [ "$DEPLOY_ONLY" != "true" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              new="$INPUT_VERSION"
            elif [[ "$(git log --oneline -1)" == *"bump version to"* ]]; then
              new="$current"
            else
              IFS='.' read -r -a parts <<< "$current"
              new="${parts[0]}.$((parts[1] + 1)).${parts[2]}"
            fi
          fi

          if [ "$new" != "$current" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            npm version "$new" --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: bump version to $new [skip ci]"
            git tag "v$new"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}" --tags
          fi

          echo "new_version=$new" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Code
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests with Coverage
        run: npm test -- --watch=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: coverage/
          if-no-files-found: ignore

  build:
    needs: [version, lint, test]
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.CLOUDFRONT_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Fetch version bump
        run: git pull --ff-only origin "$GITHUB_REF_NAME" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/analise_processo_frontend/browser
          if-no-files-found: error

  deploy:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/analise_processo_frontend/browser

      - name: Deploy to Netlify (com retry)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ inputs.netlify-site-id }}
        run: |
          set -euo pipefail
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is empty"
            exit 1
          fi
          if [ ! -d "dist/analise_processo_frontend/browser" ]; then
            echo "::error::Pasta de build nao encontrada: dist/analise_processo_frontend/browser"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if npx -y netlify-cli@27 deploy \
              --dir=dist/analise_processo_frontend/browser \
              --prod \
              --no-build \
              --auth="$NETLIFY_AUTH_TOKEN" \
              --site="$NETLIFY_SITE_ID"; then
              echo "Deploy concluido com sucesso."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Deploy falhou apos 3 tentativas"
              exit 1
            fi
            sleep 10
          done

  notify:
    if: always()
    needs: [version, lint, test, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report pipeline result
        run: |
          echo "version: ${{ needs.version.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "deploy: ${{ needs.deploy.result }}"
          echo "deployed version: ${{ needs.version.outputs.new_version }}"
