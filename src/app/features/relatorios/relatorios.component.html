<app-page-header
  title="Relatórios"
  subtitle="Indicadores de entrada e resultado financeiro"
/>

<div class="relatorios-container">
  <mat-card class="filtro-card">
    <mat-card-content class="filtro-content">
      <mat-form-field appearance="outline">
        <mat-label>Período inicial</mat-label>
        <input matInput [matDatepicker]="pickerInicio" [(ngModel)]="inicio" />
        <mat-datepicker-toggle matIconSuffix [for]="pickerInicio" />
        <mat-datepicker #pickerInicio />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Período final</mat-label>
        <input matInput [matDatepicker]="pickerFim" [(ngModel)]="fim" />
        <mat-datepicker-toggle matIconSuffix [for]="pickerFim" />
        <mat-datepicker #pickerFim />
      </mat-form-field>

      <button mat-raised-button color="primary" type="button" (click)="carregarRelatorio()">
        <mat-icon>refresh</mat-icon>
        Gerar relatório
      </button>
    </mat-card-content>
  </mat-card>

  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="40" />
    </div>
  }

  @if (!loading() && relatorio()) {
    <section class="secao">
      <h2>Entradas no período</h2>
      <div class="kpi-grid">
        @for (kpi of kpis; track kpi.label) {
          <mat-card class="kpi-card">
            <mat-card-content>
              <div class="kpi-top">
                <mat-icon [ngClass]="'accent-' + kpi.accent">{{ kpi.icon }}</mat-icon>
                <span class="kpi-label">{{ kpi.label }}</span>
              </div>
              <div class="kpi-value" [ngClass]="'accent-' + kpi.accent">{{ kpi.value }}</div>
            </mat-card-content>
          </mat-card>
        }
      </div>
    </section>

    <section class="secao">
      <h2>Resumo de carteira</h2>
      <mat-card>
        <mat-card-content>
          <table mat-table [dataSource]="tabelaResumo" class="resumo-tabela">
            <ng-container matColumnDef="metrica">
              <th mat-header-cell *matHeaderCellDef>Métrica</th>
              <td mat-cell *matCellDef="let row">{{ row.metrica }}</td>
            </ng-container>
            <ng-container matColumnDef="valor">
              <th mat-header-cell *matHeaderCellDef class="col-valor">Valor</th>
              <td mat-cell *matCellDef="let row" class="col-valor">{{ row.valor }}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="colunas"></tr>
            <tr mat-row *matRowDef="let row; columns: colunas"></tr>
          </table>
        </mat-card-content>
      </mat-card>
    </section>
  }
</div>
