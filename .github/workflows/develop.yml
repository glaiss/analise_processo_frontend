name: Frontend Develop CI/CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a implantar (default: próxima)'
        required: false
      deploy_only:
        description: 'Somente re-disparar o deploy da versão atual'
        type: boolean
        default: false
  repository_dispatch:
    types: [deploy-frontend]

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Netlify
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      deploy_only: ${{ inputs.deploy_only || false }}
      version: ${{ inputs.version || '' }}
      netlify-site-id: ${{ vars.NETLIFY_SITE_ID }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      CLOUDFRONT_URL: ${{ secrets.CLOUDFRONT_URL }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
