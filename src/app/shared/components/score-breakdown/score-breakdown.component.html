<div class="score-breakdown-container">
  <h3>Por que este processo?</h3>
  <table mat-table [dataSource]="hipoteses()" class="mat-elevation-z0">

    <ng-container matColumnDef="nomeRegra">
      <th mat-header-cell *matHeaderCellDef> Regra </th>
      <td mat-cell *matCellDef="let element"> {{element.nomeRegra}} </td>
    </ng-container>

    <ng-container matColumnDef="pontos">
      <th mat-header-cell *matHeaderCellDef> Pontos </th>
      <td mat-cell *matCellDef="let element" class="font-mono">
        <span [class.positive]="element.pontos > 0" [class.negative]="element.pontos < 0">
          {{element.pontos > 0 ? '+' : ''}}{{element.pontos}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="justificativa">
      <th mat-header-cell *matHeaderCellDef> Justificativa </th>
      <td mat-cell *matCellDef="let element"> {{element.justificativa}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
