name: Frontend Feature CI
on:
  push:
    branches:
      - 'G-*'
  pull_request:
    branches:
      - 'G-*'

jobs:
  validate:
    name: Validate Build and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watch=false

      - name: Build Project
        run: npm run build
