<div class="page-container">
  <h1>{{ title }}</h1>
  
  @if (isLoading()) {
    <p>Carregando...</p>
  }

  <app-infinite-scroll (scrolled)="onScroll()" [isLoading]="isLoading()">
    @for (atribuicao of atribuicoes; track atribuicao.id) {
      <div class="assigned-process-list-item">
        <app-assigned-process-card [atribuicao]="atribuicao"></app-assigned-process-card>
      </div>
    }
  </app-infinite-scroll>
</div>
