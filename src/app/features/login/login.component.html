<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sherlock Laws</mat-card-title>
      <mat-card-subtitle>Acesse sua conta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuário</mat-label>
          <input matInput name="username" required [(ngModel)]="credentials.username">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput name="password" required [type]="hidePassword() ? 'password' : 'text'" [(ngModel)]="credentials.password">
          <button mat-icon-button matSuffix type="button" [matTooltip]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'" (click)="hidePassword.set(!hidePassword())">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="!loginForm.form.valid || auth.isLoading()">
          @if (auth.isLoading()) {
            <mat-spinner diameter="24" />
          } @else {
            Entrar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
