name: Frontend Production CI/CD

on:
  push:
    branches:
      - 'release'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a implantar (default: próxima)'
        required: false
      deploy_only:
        description: 'Somente re-disparar o deploy da versão atual'
        type: boolean
        default: false

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      deploy_only: ${{ inputs.deploy_only || false }}
      version: ${{ inputs.version || '' }}
      bump_version: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
      netlify-site-id: ${{ vars.NETLIFY_SITE_ID }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      CLOUDFRONT_URL: ${{ secrets.CLOUDFRONT_URL }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}