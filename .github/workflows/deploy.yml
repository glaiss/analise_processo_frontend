name: Deploy Frontend (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      deploy_only:
        type: boolean
        required: false
        default: false
      version:
        type: string
        required: false
        default: ''
      bump_version:
        type: boolean
        required: false
        default: false
      netlify-site-id:
        type: string
        required: false
        default: ''
    secrets:
      GH_PAT:
        required: true
      CLOUDFRONT_URL:
        required: true
      NETLIFY_AUTH_TOKEN:
        required: true

concurrency:
  group: frontend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    uses: ./.github/workflows/bump-version.yml
    with:
      bump: ${{ inputs.bump_version }}
      version: ${{ inputs.version }}
      deploy_only: ${{ inputs.deploy_only }}

  build-test:
    needs: version
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.CLOUDFRONT_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Fetch version bump
        run: git pull --ff-only origin "$GITHUB_REF_NAME" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Code
        run: npm run lint

      - name: Run Tests
        run: npm test -- --watch=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: coverage/
          if-no-files-found: ignore

      - name: Build Project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/analise_processo_frontend/browser
          if-no-files-found: error

  deploy:
    needs: [version, build-test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/analise_processo_frontend/browser

      - name: Deploy to Netlify (com retry)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ inputs.netlify-site-id }}
        run: |
          set -euo pipefail
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is empty"
            exit 1
          fi
          if [ ! -d "dist/analise_processo_frontend/browser" ]; then
            echo "::error::Pasta de build nao encontrada: dist/analise_processo_frontend/browser"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if npx -y netlify-cli@27 deploy \
              --dir=dist/analise_processo_frontend/browser \
              --prod \
              --no-build \
              --auth="$NETLIFY_AUTH_TOKEN" \
              --site="$NETLIFY_SITE_ID"; then
              echo "Deploy concluido com sucesso."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Deploy falhou apos 3 tentativas"
              exit 1
            fi
            sleep 10
          done

  notify:
    if: always()
    needs: [version, build-test, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report pipeline result
        run: |
          echo "version: ${{ needs.version.result }}"
          echo "build-test: ${{ needs.build-test.result }}"
          echo "deploy: ${{ needs.deploy.result }}"
          echo "deployed version: ${{ needs.version.outputs.new_version }}"

      - name: Marcar pipeline como falho
        if: ${{ needs.deploy.result == 'failure' || needs.build-test.result == 'failure' }}
        run: |
          echo "::error::Pipeline falhou. Consulte os logs dos jobs acima."
          exit 1