<div class="alterar-senha-page">
  <mat-card class="alterar-senha-card">
    <mat-card-header>
      <mat-card-title>Alterar Senha</mat-card-title>
      <mat-card-subtitle>Defina uma nova senha para sua conta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha Atual</mat-label>
          <input matInput name="senhaAtual" required [type]="hideAtual() ? 'password' : 'text'" [(ngModel)]="senhaAtual">
          <button mat-icon-button matSuffix type="button" [matTooltip]="hideAtual() ? 'Mostrar senha' : 'Ocultar senha'" (click)="hideAtual.set(!hideAtual())">
            <mat-icon>{{ hideAtual() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nova Senha</mat-label>
          <input matInput name="senhaNova" required minlength="4" [type]="hideNova() ? 'password' : 'text'" [(ngModel)]="senhaNova">
          <button mat-icon-button matSuffix type="button" [matTooltip]="hideNova() ? 'Mostrar senha' : 'Ocultar senha'" (click)="hideNova.set(!hideNova())">
            <mat-icon>{{ hideNova() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar Nova Senha</mat-label>
          <input matInput name="senhaConfirmacao" required [type]="hideConfirmacao() ? 'password' : 'text'" [(ngModel)]="senhaConfirmacao">
          <button mat-icon-button matSuffix type="button" [matTooltip]="hideConfirmacao() ? 'Mostrar senha' : 'Ocultar senha'" (click)="hideConfirmacao.set(!hideConfirmacao())">
            <mat-icon>{{ hideConfirmacao() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error()) {
          <p class="error-text">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="!form.form.valid || loading()">
          @if (loading()) {
            <mat-spinner diameter="24" />
          } @else {
            Alterar Senha
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
