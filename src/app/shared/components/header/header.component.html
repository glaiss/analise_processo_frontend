<mat-toolbar color="primary" class="app-toolbar">
  <button type="button" mat-icon-button (click)="toggleSidenav.emit()">
    <mat-icon>menu</mat-icon>
  </button>
  <a class="brand" routerLink="/dashboard" aria-label="Início">
    <img
      class="brand-logo"
      alt="Logotipo Glaiss"
      width="2508"
      height="2508"
      [ngSrc]="theme.isDark() ? 'logo-tema-escuro.png' : 'logo-tema-claro.png'"
    />
  </a>
  <span class="spacer"></span>
  <div class="user-toolbar-info">
    <button type="button" class="user-avatar-btn" [matMenuTriggerFor]="userMenu">
      <span class="user-avatar">{{ avatarLetter }}</span>
    </button>
  </div>
</mat-toolbar>

<mat-menu #userMenu="matMenu" xPosition="before" yPosition="below">
  <div class="menu-user-info">
    <span class="menu-user-name">{{ auth.currentUser()?.nome || auth.currentUser()?.username }}</span>
    <span class="menu-user-equipe">{{ auth.currentUser()?.equipe }}</span>
  </div>
  <mat-divider />
  <button type="button" mat-menu-item (click)="theme.toggle()">
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    <span>{{ theme.isDark() ? 'Modo Claro' : 'Modo Escuro' }}</span>
  </button>
  <button type="button" mat-menu-item (click)="meusDados()">
    <mat-icon>person</mat-icon>
    <span>Meus Dados</span>
  </button>
  <button type="button" mat-menu-item (click)="alterarSenha()">
    <mat-icon>lock</mat-icon>
    <span>Alterar Senha</span>
  </button>
  @if (auth.hasRole('ADMIN') && !auth.isImpersonating()) {
    <button type="button" mat-menu-item (click)="openImpersonateDialog()">
      <mat-icon>visibility</mat-icon>
      <span>Entrar como outro usuário</span>
    </button>
  }
  @if (auth.isImpersonating()) {
    <button type="button" mat-menu-item (click)="stopImpersonating()">
      <mat-icon>arrow_back</mat-icon>
      <span>Voltar para meu usuário</span>
    </button>
  }
  <mat-divider />
  <button type="button" mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
