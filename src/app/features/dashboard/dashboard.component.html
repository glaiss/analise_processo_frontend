<div class="dashboard-container">
  <app-page-header title="Análise de Processos" subtitle="Monitoramento de Score e Prazos">
    <mat-button-toggle-group (change)="onViewModeChange($event)" [value]="viewMode()">
      <mat-button-toggle value="meus">Meus Processos</mat-button-toggle>
      <mat-button-toggle value="equipe">Processos da Equipe</mat-button-toggle>
    </mat-button-toggle-group>
  </app-page-header>

  <app-assigned-processes-list [mode]="viewMode()"></app-assigned-processes-list>
</div>
