[build]
  command = "npm run build"
  publish = "dist/analise_processo_frontend/browser"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/analise-processos/*"
  to = "https://d1jeo6rrv0leqt.cloudfront.net/analise-processos/analise-processos/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
