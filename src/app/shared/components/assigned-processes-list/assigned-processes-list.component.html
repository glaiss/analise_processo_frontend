<div class="page-container">
  <div class="header-container">
    <h1>{{ title }}</h1>
    @if (totalElements > 0) {
      <span class="count-badge">Total: {{ totalElements }}</span>
    }
  </div>

  @if (selectedCount() > 0) {
    <button class="fab-reprocess" mat-fab extended color="primary" matBadgeColor="accent" [disabled]="reprocessando()" [matBadge]="reprocessando() ? 0 : selectedCount()" (click)="reprocessarSelecionados()">
      @if (reprocessando()) {
        <mat-spinner diameter="20" />
      } @else {
        <mat-icon>refresh</mat-icon>
      }
      Reprocessar
    </button>
  }

  <app-loading-overlay message="Carregando {{ title.toLowerCase() }}..." [isLoading]="isLoading() && atribuicoes.length === 0"/>

  @if (atribuicoes.length === 0 && !isLoading()) {
    <app-empty-state message="Nenhum processo atribuído {{ mode === 'meus' ? 'a você' : 'à equipe' }} ainda." icon="assignment"/>
  }

  @if (atribuicoes.length > 0) {
    <app-infinite-scroll [isLoading]="isLoading()" (scrolled)="onScroll()">
      @for (atribuicao of atribuicoes; track atribuicao.id) {
        <div class="assigned-process-list-item">
          <app-assigned-process-card
            [atribuicao]="atribuicao"
            [selected]="selectedNumeros().has(atribuicao.processoNumero)"
            (selectedChange)="toggleSelection(atribuicao.processoNumero, $event)"
          />
        </div>
      }
      @if (isLoading()) {
        <div class="loading-more">
          <mat-spinner diameter="24" />
          <span>Carregando mais...</span>
        </div>
      }
    </app-infinite-scroll>
  }
</div>
