@if (auth.isImpersonating()) {
  <div class="impersonation-banner">
    <mat-icon>visibility</mat-icon>
    <span>
      Impersonando <strong>{{ auth.currentUser()?.username }}</strong>
      (admin: {{ auth.impersonatingAdmin() }})
    </span>
    <button mat-raised-button color="warn" (click)="stopImpersonating()">
      <mat-icon>exit_to_app</mat-icon> Sair da impersonação
    </button>
  </div>
}

<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="toggleSidenav.emit()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>{{ auth.currentUser()?.equipe || 'Sherlock Law' }}</span>
  <span class="spacer"></span>
  <div class="user-toolbar-info">
    <button class="user-avatar-btn" [matMenuTriggerFor]="userMenu">
      <span class="user-avatar">{{ avatarLetter }}</span>
    </button>
  </div>
</mat-toolbar>

<mat-menu #userMenu="matMenu" xPosition="before" yPosition="below">
  <div class="menu-user-info">
    <span class="menu-user-name">{{ auth.currentUser()?.nome || auth.currentUser()?.username }}</span>
    <span class="menu-user-equipe">{{ auth.currentUser()?.equipe }}</span>
  </div>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="theme.toggle()">
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    <span>{{ theme.isDark() ? 'Modo Claro' : 'Modo Escuro' }}</span>
  </button>
  <button mat-menu-item (click)="alterarSenha()">
    <mat-icon>lock</mat-icon>
    <span>Alterar Senha</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
