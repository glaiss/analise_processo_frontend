<div class="page-container">
  <div class="header-container">
    <h1>{{ title }}</h1>
    @if (totalElements > 0) {
      <span class="count-badge">Total: {{ totalElements }}</span>
    }
  </div>

  @if (selectedCount() > 0) {
    <button class="fab-reprocess" mat-fab extended color="primary" [disabled]="reprocessando()" (click)="reprocessarSelecionados()" [matBadge]="reprocessando() ? 0 : selectedCount()" matBadgeColor="accent">
      @if (reprocessando()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <mat-icon>refresh</mat-icon>
      }
      Reprocessar
    </button>
  }

  <app-loading-overlay [isLoading]="isLoading() && atribuicoes.length === 0" message="Carregando {{ title.toLowerCase() }}..."/>

  @if (atribuicoes.length === 0 && !isLoading()) {
    <app-empty-state icon="assignment" message="Nenhum processo atribuído {{ mode === 'meus' ? 'a você' : 'à equipe' }} ainda."/>
  }

  @if (atribuicoes.length > 0) {
    <app-infinite-scroll (scrolled)="onScroll()" [isLoading]="isLoading()">
      @for (atribuicao of atribuicoes; track atribuicao.id) {
        <div class="assigned-process-list-item">
          <app-assigned-process-card
            [atribuicao]="atribuicao"
            [selected]="selectedNumeros().has(atribuicao.processoNumero)"
            (selectedChange)="toggleSelection(atribuicao.processoNumero, $event)"
          ></app-assigned-process-card>
        </div>
      }
      @if (isLoading()) {
        <div class="loading-more">
          <mat-spinner diameter="24"></mat-spinner>
          <span>Carregando mais...</span>
        </div>
      }
    </app-infinite-scroll>
  }
</div>
