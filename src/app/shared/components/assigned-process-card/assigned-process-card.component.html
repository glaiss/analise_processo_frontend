<mat-card class="assigned-process-card" [ngClass]="[situationColorClass, selected ? 'selected' : '']">
  <mat-card-header>
    <mat-card-title>
      <mat-checkbox matTooltip="Selecionar para reprocessar" [checked]="selected" (click)="toggleSelection($event)" />
      <mat-icon matTooltip="Alternar Monitoramento" [class.monitored]="atribuicao.monitorado" (click)="toggleMonitoramento($event)">
        {{ atribuicao.monitorado ? 'star' : 'star_border' }}
      </mat-icon>
      <span class="process-number font-mono" matTooltip="Copiar número do processo" (click)="copyProcessNumber($event)">{{ atribuicao.processoNumero }}</span>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="card-content">
    <div class="info-row">
      <span class="label">Score Final</span>
      <mat-chip-listbox>
        <mat-chip selected class="font-mono" [color]="scoreColor">{{ atribuicao.processoScoreFinal }}</mat-chip>
      </mat-chip-listbox>
    </div>
    <div class="info-row">
      <span class="label">Tipologia</span>
      <span class="value">{{ tipologiaLabel }}</span>
    </div>
    <div class="info-row">
      <span class="label">Prazo</span>
      @if (atribuicao.statusPrazo) {
        <mat-chip-listbox>
          <mat-chip selected [color]="statusPrazoColor">
            {{ atribuicao.statusPrazo }}
            @if (atribuicao.isVencendoPrazo) {
              <mat-icon matChipTrailingIcon>warning</mat-icon>
            }
          </mat-chip>
        </mat-chip-listbox>
      } @else {
        <span class="value">Sem prazo</span>
      }
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button type="button" mat-flat-button color="primary" class="details-button" (click)="openDetails($event)">
      <mat-icon>info</mat-icon>
      Ver detalhes
    </button>
  </mat-card-actions>
</mat-card>
